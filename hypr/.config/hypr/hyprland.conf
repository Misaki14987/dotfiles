# eDP-1(笔记本屏,3200x2000/~239 PPI)先关掉不用:Caelestia 的字体用 pointSize,
# Qt 会按屏幕物理尺寸(mm)算 DPI 来放大字号,跟 Hyprland 的 scale 是两套独立逻辑,
# 光调 scale 治不好文字爆炸。真要用这块屏的话,试 `env = QT_WAYLAND_FORCE_DPI,96`
# 强制 Qt 用固定 DPI(这样字体也会跟着 scale 走,不再按物理尺寸算),而不是继续改 scale。
monitor=HDMI-A-1,1920x1080@60,0x0,1
monitor=eDP-1,disable

env = XMODIFIERS,@im=fcitx
env = QT_IM_MODULE,fcitx
env = GTK_IM_MODULE,fcitx
env = SDL_IM_MODULE,fcitx
env = INPUT_METHOD,fcitx

# Autostart
exec-once = kitty
exec-once = fcitx5 -d --replace

# caelestia 桌面外壳 (Quickshell)
exec-once = qs -c caelestia

# 启动器
bind = SUPER, Q, exec, kitty
bind = SUPER, D, exec, fuzzel
bind = SUPER, W, exec, google-chrome --proxy-server=127.0.0.1:2080
bind = SUPER, E, exec, nautilus

# 壁纸: 随机切换 / 打开选择器(弹出后输入 >wallpaper 加关键词搜索)
bind = SUPER, COMMA, exec, caelestia wallpaper -r
bind = SUPER, PERIOD, exec, qs -c caelestia ipc call drawers toggle launcher

# 窗口控制
bind = SUPER, C, killactive,
bind = SUPER SHIFT, E, exit,
bind = SUPER, F, fullscreen,
bind = SUPER, V, togglefloating,

# 切换焦点窗口 (vim 键位: h左 j下 k上 l右)
bind = SUPER, H, movefocus, l
bind = SUPER, J, movefocus, d
bind = SUPER, K, movefocus, u
bind = SUPER, L, movefocus, r

# 移动窗口 (vim 键位)
bind = SUPER SHIFT, H, movewindow, l
bind = SUPER SHIFT, J, movewindow, d
bind = SUPER SHIFT, K, movewindow, u
bind = SUPER SHIFT, L, movewindow, r

# 鼠标拖动浮动窗口 (SUPER+左键移动, SUPER+右键缩放)
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# 工作区 1-5
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1

# 锁屏 / 截图 / 电源菜单
bind = CTRL ALT, L, exec, qs -c caelestia ipc call lock lock
bind = , Print, exec, grim -g "$(slurp)" - | tee ~/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png | wl-copy
bind = SUPER, Escape, exec, qs -c caelestia ipc call drawers toggle session

# 音量 / 亮度 / 媒体键 (笔记本功能键排)
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp, exec, qs -c caelestia ipc call brightness set +5%
bindel = , XF86MonBrightnessDown, exec, qs -c caelestia ipc call brightness set 5%-
bindl = , XF86AudioPlay, exec, qs -c caelestia ipc call mpris playPause
bindl = , XF86AudioNext, exec, qs -c caelestia ipc call mpris next
bindl = , XF86AudioPrev, exec, qs -c caelestia ipc call mpris previous
